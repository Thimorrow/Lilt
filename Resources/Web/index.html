<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Lilt</title>
  <link rel="stylesheet" href="notch.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="wordmark" viewBox="0 0 152 100"><g fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12V86M45 54V86M79 12V86M113 24V68Q113 86 131 86M101 48H137"/></g><path d="M30 2H60V18A8 8 0 0 1 52 26H38A8 8 0 0 1 30 18Z" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 6.6v10.8a.9.9 0 0 0 1.4.75l8.1-5.4a.9.9 0 0 0 0-1.5L6.4 5.85A.9.9 0 0 0 5 6.6Z" fill="currentColor"/><rect x="16.6" y="5.5" width="2.6" height="13" rx="1.3" fill="currentColor"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></g></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 1.6M9.5 3h5"/></g></symbol>
    <symbol id="i-shelf" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5 6 6.5A2 2 0 0 1 7.9 5h8.2A2 2 0 0 1 18 6.5l2.5 7v4A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M3.5 13.5H8l1.5 2h5l1.5-2h4.5"/></g></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></g></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></g></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9.3 3-.5 2-1.4.8-2-.5-2.7 4.6 1.6 1.5v1.6l-1.6 1.5 2.7 4.6 2-.5 1.4.8.5 2h5.4l.5-2 1.4-.8 2 .5 2.7-4.6-1.6-1.5v-1.6l1.6-1.5-2.7-4.6-2 .5-1.4-.8-.5-2Z"/><circle cx="12" cy="12.2" r="3"/></g></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5.5-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 18"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 6.5a14.5 14.5 0 0 1 20 0M5.5 10.2a9.4 9.4 0 0 1 13 0M9 13.8a4.3 4.3 0 0 1 6 0"/></g></symbol>
    <symbol id="i-battery" viewBox="0 0 34 16"><rect x="1" y="1.5" width="28" height="13" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3.4" y="3.9" width="20" height="8.2" rx="1.6" fill="currentColor"/><path d="M31.2 5.6v4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<section class="notch" id="notch" data-state="compact" data-view="music" aria-label="Lilt UI preview">
        <button class="notch-compact needs-js" type="button" aria-expanded="false" aria-controls="notch-panel">
          <span class="wing" data-compact="left"><span class="mini-cover"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-music"/></svg></span></span>
          <span class="sr" data-live="compact-label">Open the notch: Music, Meld</span>
          <span class="wing wing-right" data-compact="right" aria-hidden="true">Meld</span>
        </button>
        <div class="notch-panel" id="notch-panel">
          <button class="notch-wings" type="button" data-action="fold" aria-label="Fold Lilt" title="Fold Lilt">
            <span class="wing" data-wing="left"><span class="mini-cover"><svg viewBox="0 0 24 24"><use href="#i-music"/></svg></span></span>
            <span class="wing wing-right" data-wing="right"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span></span>
          </button>

          <div class="view music" id="view-music" role="tabpanel" aria-labelledby="tab-music">
            <div class="cover"><img alt="" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-music"/></svg></div>
            <div class="track-meta"><strong data-live="title">Meld</strong><span data-live="artist">Connecting…</span></div>
            <div class="controls needs-js">
              <button class="icon-btn" type="button" data-action="prev" aria-label="Previous Meld track"><svg style="transform:scaleX(-1)"><use href="#i-next"/></svg></button>
              <button class="icon-btn big" type="button" data-action="play" aria-label="Play Meld" title="Play Meld" aria-pressed="false"><svg><use href="#i-play" data-live="play-icon"/></svg></button>
              <button class="icon-btn" type="button" data-action="next" aria-label="Next Meld track"><svg><use href="#i-next"/></svg></button>
            </div>
            <div class="progress" role="progressbar" aria-label="Meld playback position"><span data-live="elapsed">0:00</span><span class="bar"><i data-live="bar"></i></span><span data-live="duration">–:––</span></div>
            <div class="music-note" role="status"><span data-live="music-note"></span><button type="button" data-action="meld-open">Open Meld</button></div>
          </div>

          <div class="view focus" id="view-focus" role="tabpanel" aria-labelledby="tab-focus" hidden>
            <button class="focus-time focus-trigger" id="focus-duration" type="button" data-action="focus-menu" data-menu="duration" aria-label="Focus duration, 25 minutes" aria-haspopup="dialog" aria-expanded="false" aria-controls="focus-duration-menu"><span data-live="focus">25:00</span><svg class="focus-chevron" aria-hidden="true"><use href="#i-up"/></svg></button>
            <div class="focus-meta"><button id="focus-activity" class="focus-activity focus-trigger" type="button" data-action="focus-menu" data-menu="activity" aria-label="Brain.fm activity, Deep Work" aria-haspopup="menu" aria-expanded="false" aria-controls="focus-activity-menu"><span data-live="focus-activity">Deep Work</span><svg class="focus-chevron" aria-hidden="true"><use href="#i-up"/></svg></button><div class="focus-note"><span data-live="focus-note">Brain.fm</span><button class="focus-help" type="button" data-action="brainfm-settings" hidden>Open Settings</button><button class="focus-help" type="button" data-action="brainfm-open" hidden>Open Brain.fm</button></div></div>
            <div class="controls needs-js">
              <button class="icon-btn big" type="button" data-action="focus" aria-label="Start focus and Brain.fm" title="Start Brain.fm in the background"><svg><use href="#i-play" data-live="focus-icon"/></svg></button>
              <button class="icon-btn" type="button" data-action="focus-reset" aria-label="Reset the focus timer to 25 minutes"><svg><use href="#i-reset"/></svg></button>
            </div>
            <div class="focus-menu" id="focus-activity-menu" role="menu" aria-label="Brain.fm activity" hidden><button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-action="focus-activity" data-activity="deepWork"><span>Deep Work</span><span class="focus-menu-check" aria-hidden="true">✓</span></button><button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-action="focus-activity" data-activity="lightWork"><span>Light Work</span><span class="focus-menu-check" aria-hidden="true">✓</span></button></div>
            <div class="focus-menu" id="focus-duration-menu" role="dialog" aria-label="Focus duration" hidden><div role="menu" aria-label="Duration presets"><button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-action="focus-duration" data-minutes="25"><span>25 min</span><span class="focus-menu-check" aria-hidden="true">✓</span></button><button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-action="focus-duration" data-minutes="50"><span>50 min</span><span class="focus-menu-check" aria-hidden="true">✓</span></button><button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-action="focus-custom" data-minutes="custom"><span>Custom…</span><span class="focus-menu-check" aria-hidden="true">✓</span></button></div><form id="focus-config" class="focus-config" hidden><label class="sr" for="focus-minutes">Custom duration in minutes</label><input id="focus-minutes" type="number" min="1" max="180" step="1" value="25" autocomplete="off" spellcheck="false"><span aria-hidden="true">min</span><button type="submit" aria-label="Set focus duration">Set</button></form></div>
          </div>

          <div class="view shelf" id="view-shelf" role="tabpanel" aria-labelledby="tab-shelf" hidden>
            <button class="drop needs-js" type="button" data-action="choose"><svg aria-hidden="true"><use href="#i-shelf"/></svg><span>Drop files here, or choose some</span></button>
            <ul class="files" data-live="files" aria-label="On the shelf" tabindex="0" hidden></ul>
            <p class="shelf-note" role="status" data-live="shelf-note" hidden></p>
            <div class="shelf-actions needs-js" hidden><button class="text-btn" type="button" data-action="choose">Add</button><button class="text-btn" type="button" data-action="clear">Clear</button></div>
          </div>

          <div class="notch-foot needs-js">
            <div class="tabs" role="tablist" aria-label="Notch views">
              <button type="button" role="tab" id="tab-music" aria-controls="view-music" aria-selected="true" data-view="music"><svg aria-hidden="true"><use href="#i-music"/></svg><span>Music</span></button>
              <button type="button" role="tab" id="tab-focus" aria-controls="view-focus" aria-selected="false" tabindex="-1" data-view="focus"><svg aria-hidden="true"><use href="#i-focus"/></svg><span>Focus</span></button>
              <button type="button" role="tab" id="tab-shelf" aria-controls="view-shelf" aria-selected="false" tabindex="-1" data-view="shelf"><svg aria-hidden="true"><use href="#i-shelf"/></svg><span>Shelf</span></button>
            </div>
            <button class="settings-button" type="button" data-action="settings" aria-label="Open Lilt settings" title="Settings"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
          </div>
        </div>

      </section>
<p class="sr" role="status" aria-live="polite" data-announce></p>
</body>
</html>
