name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Swift tests
        run: swift test
      - name: JavaScript tests
        run: node --test scripts/test-ui.mjs scripts/test-focus.mjs scripts/test-settings.mjs
      - name: Shell syntax
        run: bash -n scripts/build-app.sh scripts/build-meld-bridge.sh
      - name: Build without Android or signing credentials
        env:
          LILT_BUILD_MELD: '0'
          LILT_SIGN_IDENTITY: '-'
        run: ./scripts/build-app.sh
      - name: Verify app signature and bundled licences
        run: |
          codesign --verify --deep --strict build/Lilt.app
          cmp LICENSE build/Lilt.app/Contents/Resources/Licenses/LICENSE
          cmp THIRD_PARTY_NOTICES.md build/Lilt.app/Contents/Resources/Licenses/THIRD_PARTY_NOTICES.md
          cmp Resources/Licenses/Familjen-Grotesk-OFL.txt build/Lilt.app/Contents/Resources/Licenses/Familjen-Grotesk-OFL.txt

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact --no-banner --log-opts=--all .
